name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Commit the smoke-test screenshots to docs/screenshots on this branch
        type: boolean
        default: false

permissions:
  contents: write # only used by the release step on tags

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".TrimStart("v") }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/StartBarController.Core.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/StartBarController.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o out/standalone

      - name: Smoke test (open every page, save screenshots)
        shell: pwsh
        run: |
          $folder = Join-Path $PWD "out/smoke"
          $p = Start-Process out/standalone/StartBarController.exe -ArgumentList "--smoke-test", "`"$folder`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "The app did not finish the smoke test in time." }
          if (Test-Path "$folder/error.txt") { Get-Content "$folder/error.txt"; throw "The app failed the smoke test." }
          if ($p.ExitCode -ne 0) { throw "Smoke test exit code $($p.ExitCode)" }
          Get-ChildItem $folder

      - name: Commit screenshots
        if: inputs.update_screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/screenshots | Out-Null
          Copy-Item out/smoke/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update screenshots from the CI smoke test [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          }

      - name: Command line
        shell: pwsh
        run: |
          $p = Start-Process out/standalone/StartBarController.exe -ArgumentList "--list-settings" -NoNewWindow -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "--list-settings did not finish." }
          if ($p.ExitCode -ne 0) { throw "--list-settings exit code $($p.ExitCode)" }

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.value }}" installer/StartBarController.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: StartBarController-Setup
          path: out/installer/*.exe
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: StartBarController-portable
          path: out/standalone/StartBarController.exe
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: out/smoke
          retention-days: 3

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item out/standalone/StartBarController.exe out/StartBarController-portable.exe
          gh release create "${{ github.ref_name }}" (Get-Item out/installer/*.exe).FullName out/StartBarController-portable.exe `
            --title "${{ github.ref_name }}" --generate-notes
